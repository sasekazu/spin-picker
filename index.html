<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin Picker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Spin Picker</h1>

<div class="container">
  <div class="wheel-area card">
    <div class="wheel-wrapper">
      <div class="pointer"></div>
      <canvas id="wheelCanvas" width="420" height="420"></canvas>
    </div>
    <button id="startBtn">START</button>
    <div id="result"></div>
  </div>

  <div class="input-area card">
    <label for="itemsInput">Items (one per line)</label>
    <textarea id="itemsInput" spellcheck="false">A
B
C
D
E
F</textarea>
    <div class="hint">Blank lines are ignored. Pasting a column from Excel also works.</div>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
